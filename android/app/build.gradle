apply plugin: 'com.android.application'

def uploadKeyPropertiesFile = rootProject.file('keystore.properties')
def uploadKeyProperties = new Properties()
def preparedMobileAssetsDir = file("${System.properties['java.io.tmpdir']}/datachat-mobile-assets")
if (uploadKeyPropertiesFile.exists()) {
    uploadKeyProperties.load(new FileInputStream(uploadKeyPropertiesFile))
}

android {
    namespace = "com.lamekstar.datachat"
    compileSdk = rootProject.ext.compileSdkVersion
    sourceSets {
        main {
            // OneDrive can expose generated web files as reparse points, which
            // Android's asset merger rejects. Build from a prepared local copy.
            assets.srcDirs = [preparedMobileAssetsDir]
            // Downloadable release artifacts are hosted by Cloudflare and must
            // never be recursively embedded inside the mobile application.
            assets.exclude("public/downloads/**")
        }
    }
    defaultConfig {
        applicationId "com.lamekstar.datachat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.3.5"
        // The direct-download APK targets the CPU architecture used by
        // current Android phones. Google Play will generate other splits
        // from the app bundle when an upload key is configured.
        ndk {
            abiFilters "arm64-v8a"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadKeyPropertiesFile.exists()) {
            release {
                storeFile rootProject.file(uploadKeyProperties['storeFile'])
                storePassword uploadKeyProperties['storePassword']
                keyAlias uploadKeyProperties['keyAlias']
                keyPassword uploadKeyProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (uploadKeyPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // Keeps the direct-download build installable until the
                // permanent Google Play upload key is supplied.
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

tasks.register('removeEmbeddedDownloadArtifacts', Delete) {
    delete file('src/main/assets/public/downloads')
}
tasks.register('prepareMobileAssets') {
    doLast {
        delete preparedMobileAssetsDir
        ant.copy(todir: preparedMobileAssetsDir) {
            fileset(dir: file('src/main/assets')) {
                exclude(name: 'public/downloads/**')
            }
        }
    }
}
tasks.named('preBuild').configure {
    dependsOn 'removeEmbeddedDownloadArtifacts', 'prepareMobileAssets'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
