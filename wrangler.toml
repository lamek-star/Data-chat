name = "datachat"
main = "worker/index.js"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/.well-known/assetlinks.json"]

[vars]
APP_URL = "https://datachat.harmongt.uk"
STRIPE_PRO_PRICE_ID = "price_1TvkwtHmCwS1qvj6UKa8921s"
STRIPE_CHECKOUT_MODE = "payment"
PRO_PLAN_NAME = "DataChat Pro"
PRO_PLAN_PRICE_LABEL = "Stripe checkout"
# Sign-in codes. Email Routing is on for harmongt.uk; until paid Email
# Service is enabled, codes reach only verified destination addresses.
AUTH_EMAIL_FROM = "DataChat <no-reply@harmongt.uk>"
# Public SHA-256 fingerprint of the Android release signing key (not a
# secret). Publishes /.well-known/assetlinks.json so the app can use passkeys.
ANDROID_SIGNING_SHA256 = "3A:1E:C3:1A:BD:CA:BB:0F:25:49:11:62:55:7D:0D:33:87:65:FF:6E:5B:FC:E1:4C:64:4A:86:C1:59:20:21:5D"
# Secrets: set with `wrangler secret put <NAME>`, never in this file:
#   AUTH_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "datachat"
database_id = "73bb0aae-ecdb-43f4-a8d7-8b3a9e4ca151"
migrations_dir = "migrations"
