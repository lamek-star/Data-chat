name = "datachat"
main = "worker/index.js"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

# Custom domains. All of them are listed: deploy keeps exactly this set, so a
# domain missing here would be detached from the Worker.
routes = [
  { pattern = "datachat.harmongt.uk", custom_domain = true },
  { pattern = "www.datachat.harmongt.uk", custom_domain = true },
  { pattern = "admin.datachat.harmongt.uk", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# The Worker sees every request except built files, so it can tell the admin
# host apart from the member app (shared/router.js).
run_worker_first = ["/*", "!/assets/*"]

[vars]
APP_URL = "https://datachat.harmongt.uk"
STRIPE_PRO_PRICE_ID = "price_1TvkwtHmCwS1qvj6UKa8921s"
STRIPE_CHECKOUT_MODE = "payment"
PRO_PLAN_NAME = "DataChat Pro"
PRO_PLAN_PRICE_LABEL = "Stripe checkout"
# Sign-in codes. Email Routing is on for harmongt.uk; until paid Email
# Service is enabled, codes reach only verified destination addresses.
AUTH_EMAIL_FROM = "DataChat <no-reply@harmongt.uk>"
# Public SHA-256 fingerprint of the Android release signing key (not a
# secret). Publishes /.well-known/assetlinks.json so the app can use passkeys.
ANDROID_SIGNING_SHA256 = "3A:1E:C3:1A:BD:CA:BB:0F:25:49:11:62:55:7D:0D:33:87:65:FF:6E:5B:FC:E1:4C:64:4A:86:C1:59:20:21:5D"
# Admin dashboard host (shared/adminHost.js). Optional Cloudflare Access check:
# set ACCESS_TEAM_DOMAIN and ACCESS_AUD once Access protects that host.
ADMIN_HOST = "admin.datachat.harmongt.uk"
# Cloudflare Access protects the admin host (application "DataChat Admin",
# policy "Admins only"); the Worker also checks Access's signed token on every
# admin request. Both values are public identifiers, not secrets.
ACCESS_TEAM_DOMAIN = "https://super-shape-82d2.cloudflareaccess.com"
ACCESS_AUD = "805e025e473d86fa65bcad8b867b3f8e15810cad49feff328978d6f76f699ef4"
# Secrets: set with `wrangler secret put <NAME>`, never in this file:
#   AUTH_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

[[send_email]]
name = "EMAIL"

[[d1_databases]]
binding = "DB"
database_name = "datachat"
database_id = "73bb0aae-ecdb-43f4-a8d7-8b3a9e4ca151"
migrations_dir = "migrations"
