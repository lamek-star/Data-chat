name = "datachat"
main = "worker/index.js"
compatibility_date = "2026-07-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
APP_URL = "https://datachat.harmongt.uk"
STRIPE_PRO_PRICE_ID = "price_1TvkwtHmCwS1qvj6UKa8921s"
STRIPE_CHECKOUT_MODE = "payment"
PRO_PLAN_NAME = "DataChat Pro"
PRO_PLAN_PRICE_LABEL = "Stripe checkout"
# Secrets: set with `wrangler secret put <NAME>`, never in this file:
#   AUTH_SECRET, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

[[d1_databases]]
binding = "DB"
database_name = "datachat"
database_id = "73bb0aae-ecdb-43f4-a8d7-8b3a9e4ca151"
migrations_dir = "migrations"
